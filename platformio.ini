; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c6-devkitc-1
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@^7.0.4
	knolleary/PubSubClient@^2.8
	fastled/FastLED@^3.6.0
	ayushsharma82/ElegantOTA@^3.1.7
build_flags = 
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
  -DOOR_CLOSED_SWITCH=4 ; Use internal pull-up. Connect other leg to GND.
  -HALL_EFFECT_SENSRO_A=5
  -HALL_EFFECT_SENSRO_B=6
  -RELAY_MODULE_IN=12 ; Wire in parallel to garage opener's wall button.
	-DLD2450_FRONT_RX=16 ; No GIPO 16
  -DLD2450_FRONT_TX=17 ; No GIPO 17
	-DLD2450_REAR_RX=18 
  -DLD2450_REAR_TX=19
	-DLED_PIN=8 
  -DLED_COUNT=30
monitor_speed = 250000
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
